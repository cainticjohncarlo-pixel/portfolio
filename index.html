  /* Project CTA button, pulse + shimmer + arrow */
  .proj-cta-btn {
    position: relative;
    display: inline-flex; align-items: center; gap: 12px;
    padding: 20px 30px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: var(--font-sans);
    font-size: 15px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
    text-decoration: none; white-space: nowrap;
    overflow: hidden;
    transition: transform .25s ease, box-shadow .25s ease;
    animation: cta-pulse 2.4s ease-in-out infinite;
    cursor: pointer;
  }
  .proj-cta-btn .arrow {
    display: inline-block;
    transition: transform .3s cubic-bezier(.2,.7,.2,1);
    font-size: 18px;
    line-height: 1;
  }
  .proj-cta-btn::before {
    content: "";
    position: absolute; top: 0; left: -150%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
    transform: skewX(-20deg);
    transition: left .7s cubic-bezier(.2,.7,.2,1);
    pointer-events: none;
  }
  .proj-cta-btn:hover {
    transform: scale(1.06);
    animation-play-state: paused;
    box-shadow: 0 14px 40px color-mix(in oklab, var(--accent) 50%, transparent),
                0 0 0 1px color-mix(in oklab, var(--accent) 80%, transparent);

  .proj-cta-btn:hover .arrow { transform: translateX(8px); }
  .proj-cta-btn:hover::before { left: 150%; }
  .proj-demo-link {

    position: absolute; border-radius: 50%;

    will-change: transform;

  .stack-track-right { animation: tool-roll-rev 24s linear infinite; }

/* ---------- 4. Stats ---------- */
function AnimatedStat({ value, label, idx, total }) {
  const ref = useRef(null);
  const m = String(value).match(/^([^\d.-]*)([\d.]+)(.*)$/);
  const prefix = m ? m[1] : "";
  const target = m ? parseFloat(m[2]) : 0;
  const suffix = m ? m[3] : "";
  const decimals = m && m[2].includes(".") ? (m[2].split(".")[1] || "").length : 0;
  const initial = m ? prefix + (decimals ? (0).toFixed(decimals) : "0") + suffix : value;
  const [display, setDisplay] = useState(initial);
  const [glow, setGlow] = useState(false);
  const animatedRef = useRef(false);

  useEffect(() => {
    if (!m) return;
    const node = ref.current;
    if (!node) return;
    const obs = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting && !animatedRef.current) {
          animatedRef.current = true;
          setGlow(true);
          const duration = 1600 + idx * 120;
          const start = performance.now();
          const tick = (now) => {
            const t = Math.min(1, (now - start) / duration);
            const eased = 1 - Math.pow(1 - t, 3);
            const cur = target * eased;
            setDisplay(prefix + (decimals ? cur.toFixed(decimals) : Math.floor(cur).toString()) + suffix);
            if (t < 1) requestAnimationFrame(tick);
            else { setDisplay(value); setTimeout(() => setGlow(false), 600); }
          };
          requestAnimationFrame(tick);
        }
      });
    }, { threshold: 0.35 });
    obs.observe(node);
    return () => obs.disconnect();
  }, [value]);

  return (
    <div ref={ref} style={{
      padding: "26px 24px",
      borderRight: idx < total - 1 ? "1px solid var(--line)" : "none",
      position: "relative",
      overflow: "hidden",
    }}>
      <div style={{
        fontFamily: "var(--font-display)",
        fontSize: "clamp(32px, 3.4vw, 48px)",
        lineHeight: 1, letterSpacing: "-0.03em",
        fontWeight: 400,
        fontVariantNumeric: "tabular-nums",
        transition: "color .5s, text-shadow .5s, transform .5s",
        color: glow ? "var(--accent)" : "var(--ink)",
        textShadow: glow ? "0 0 28px color-mix(in oklab, var(--accent) 65%, transparent)" : "none",
        transform: glow ? "translateY(-1px)" : "none",
      }}>{display}</div>
      <div style={{
        fontFamily: "var(--font-mono)", fontSize: 11,
        color: "var(--ink-dim)", marginTop: 10, textTransform: "uppercase",
        letterSpacing: "0.06em",
      }}>{label}</div>
      <div aria-hidden style={{
        position: "absolute", left: 0, right: 0, bottom: 0,
        height: 2, background: "var(--accent)",
        transform: glow ? "scaleX(1)" : "scaleX(0)",
        transformOrigin: "left",
        transition: "transform 1.4s cubic-bezier(.2,.7,.2,1)",
        opacity: 0.55,
      }} />
    </div>
  );
}

/* ---------- shared marquee hook (JS-driven, guaranteed motion) ---------- */
function useMarquee(secondsPerHalf, reverse) {
  const trackRef = useRef(null);
  const containerRef = useRef(null);
  useEffect(() => {
    const track = trackRef.current;
    const container = containerRef.current;
    if (!track) return;
    let pos = 0;
    let paused = false;
    let last = performance.now();
    let raf;
    const onEnter = () => { paused = true; };
    const onLeave = () => { paused = false; };
    const onIframe = () => {
      paused = !!track.querySelector("iframe");
    };
    const observer = new MutationObserver(onIframe);
    observer.observe(track, { childList: true, subtree: true });
    if (container) {
      container.addEventListener("mouseenter", onEnter);
      container.addEventListener("mouseleave", onLeave);
    }
    const tick = (now) => {
      const dt = now - last;
      last = now;
      if (!paused) {
        const half = track.scrollWidth / 2;
        if (half > 0) {
          const pxPerMs = half / (secondsPerHalf * 1000);
          if (reverse) {
            pos += pxPerMs * dt;
            if (pos >= 0) pos -= half;
          } else {
            pos -= pxPerMs * dt;
            if (pos <= -half) pos += half;
          }
          track.style.transform = `translate3d(${pos}px, 0, 0)`;
        }
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => {
      cancelAnimationFrame(raf);
      observer.disconnect();
      if (container) {
        container.removeEventListener("mouseenter", onEnter);
        container.removeEventListener("mouseleave", onLeave);
      }
    };
  }, [secondsPerHalf, reverse]);
  return { trackRef, containerRef };
}

/* ---------- shared AnimatedNumber (count-up on scroll-into-view) ---------- */
function AnimatedNumber({ value, delay = 0 }) {
  const ref = useRef(null);
  const m = String(value).match(/^([^\d.-]*)([\d.]+)(.*)$/);
  const prefix = m ? m[1] : "";
  const target = m ? parseFloat(m[2]) : 0;
  const suffix = m ? m[3] : "";
  const decimals = m && m[2].includes(".") ? (m[2].split(".")[1] || "").length : 0;
  const initial = m ? prefix + (decimals ? (0).toFixed(decimals) : "0") + suffix : value;
  const [display, setDisplay] = useState(initial);
  const animatedRef = useRef(false);
  useEffect(() => {
    if (!m) { setDisplay(value); return; }
    const node = ref.current;
    if (!node) return;
    const obs = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting && !animatedRef.current) {
          animatedRef.current = true;
          const startAt = performance.now() + delay;
          const duration = 1400;
          const tick = (now) => {
            if (now < startAt) { requestAnimationFrame(tick); return; }
            const t = Math.min(1, (now - startAt) / duration);
            const eased = 1 - Math.pow(1 - t, 3);
            const cur = target * eased;
            setDisplay(prefix + (decimals ? cur.toFixed(decimals) : Math.floor(cur).toString()) + suffix);
            if (t < 1) requestAnimationFrame(tick);
            else setDisplay(value);
          };
          requestAnimationFrame(tick);
        }
      });
    }, { threshold: 0.4 });
    obs.observe(node);
    return () => obs.disconnect();
  }, [value, delay]);
  return <span ref={ref}>{display}</span>;
}

/* ---------- App ---------- */
function App() {
  useEffect(() => {
    // Section reveal on scroll
    const sections = document.querySelectorAll("section[data-section]");
    sections.forEach((s) => s.classList.add("section-reveal"));
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          e.target.classList.add("in-view");
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.08, rootMargin: "0px 0px -40px 0px" });
    sections.forEach((s) => io.observe(s));
    return () => io.disconnect();
  }, []);

  useEffect(() => {
    // Hero mouse-tracked spotlight
    const onMove = (e) => {
      const heroes = document.querySelectorAll(".hero-spotlight");
      heroes.forEach((h) => {
        const rect = h.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        h.style.setProperty("--mouse-x", `${x}%`);
        h.style.setProperty("--mouse-y", `${y}%`);
      });
    };
    window.addEventListener("mousemove", onMove, { passive: true });
    return () => window.removeEventListener("mousemove", onMove);
  }, []);

  return (
    <>
      <Nav />
      <Hero />
      <Marquee />
      <Stats />
      <Services />
      <Stack />
      <Projects />
      <Process />
      <Testimonials />
      <TrustedBy />
      <Blog />
      <About />
      <FAQ />
      <CTA />
      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>
